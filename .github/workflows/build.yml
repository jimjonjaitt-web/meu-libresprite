name: Build LibreSprite Windows EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install MSYS2, GCC and SDL2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-pkgconf

      - name: Compile executable
        shell: msys2 {0}
        run: |
          set -eux
          g++ -std=c++17 -O2 \
            main_gui.cpp LibreSpriteCore.cpp \
            -o libresprite.exe \
            -mwindows \
            -I/mingw64/include \
            -L/mingw64/lib \
            -lmingw32 -lSDL2main -lSDL2 \
            -static-libgcc -static-libstdc++

      - name: Bundle required DLLs
        shell: msys2 {0}
        run: |
          set -eux
          mkdir -p dist
          cp libresprite.exe dist/
          cp /mingw64/bin/SDL2.dll dist/
          cp /mingw64/bin/libwinpthread-1.dll dist/

          ldd dist/libresprite.exe || true
          ls -lh dist/

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: libresprite-windows
          path: dist/
          if-no-files-found: error
