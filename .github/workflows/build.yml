name: Build Windows EXE
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        shell: bash
        run: g++ -std=c++17 -O2 main_gui.cpp LibreSpriteCore.cpp -o libresprite.exe -mwindows -static

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: libresprite-windows
          path: libresprite.exe
