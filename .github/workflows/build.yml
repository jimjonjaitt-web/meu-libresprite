name: Build LibreSprite Windows EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install MSYS2, GCC and SDL2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-pkgconf

      - name: Verify compiler and SDL2
        shell: msys2 {0}
        run: |
          set -eux
          which g++
          g++ --version
          pkg-config --modversion sdl2
          test -f /mingw64/include/SDL2/SDL.h
          ls -l /mingw64/lib/libSDL2*

      - name: Compile executable
        shell: msys2 {0}
        run: |
          set -eux
          g++ -std=c++17 -O2 \
            main_gui.cpp LibreSpriteCore.cpp \
            -o libresprite.exe \
            -mwindows \
            -I/mingw64/include \
            -L/mingw64/lib \
            -lmingw32 -lSDL2main -lSDL2 \
            -static-libgcc -static-libstdc++

      - name: Verify executable
        shell: msys2 {0}
        run: |
          test -f libresprite.exe
          ls -lh libresprite.exe
          file libresprite.exe

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: libresprite-windows
          path: libresprite.exe
          if-no-files-found: error
