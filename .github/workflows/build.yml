name: Build Windows EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Install MinGW and SDL2
        shell: pwsh
        run: |
          choco install mingw -y
          vcpkg install sdl2:x64-mingw-dynamic

      - name: Configure compiler
        shell: bash
        run: |
          echo "C:/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"

      - name: Compile LibreSprite
        shell: bash
        run: |
          g++ -std=c++17 -O2 main_gui.cpp LibreSpriteCore.cpp -o libresprite.exe -mwindows -static -I"C:/vcpkg/installed/x64-mingw-dynamic/include" -L"C:/vcpkg/installed/x64-mingw-dynamic/lib" -lmingw32 -lSDL2main -lSDL2

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: libresprite-windows
          path: libresprite.exe
